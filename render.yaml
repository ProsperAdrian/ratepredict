services:
  - type: web
    name: ratepredict-usdtngn-proxy
    runtime: python
    plan: starter
    autoDeploy: true
    buildCommand: pip install -r proxy-requirements.txt
    startCommand: uvicorn proxy_server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: QBOT_USDTNGN_RATE_URL
        value: https://qbot-test.qdx.global/api/v1/rates-export/current/USDTNGN
      - key: QBOT_SERVICE_TOKEN
        sync: false
      - key: QBOT_CF_ACCESS_CLIENT_ID
        sync: false
      - key: QBOT_CF_ACCESS_CLIENT_SECRET
        sync: false
      - key: LIVE_USDTNGN_PROXY_TOKEN
        sync: false
